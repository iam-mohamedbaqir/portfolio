<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=JetBrains+Mono:wght@400;500&amp;family=Onest:wght@400..700&amp;display=swap">
<title>Mohammed Baqir Al-Janabi</title>
<style id="cv-css">
:root{
  /* Layout: split hero (oversized name left, leaf-shaped portrait with a code card right); every section below hangs off a left rail of code-comment labels; dark forest blocks hold the lead skill and the contact details. */
  --paper:#F2F7EE;
  --surface:#FFFFFF;
  --ink:#10291D;
  --ink-soft:#4F6356;
  --leaf:#0E7A4E;
  --lime:#C6F36B;
  --mint:#DDEBD9;
  --line:#CCDCC9;
  --forest:#0F2A1D;
  --on-forest:#EAF5E6;
  --on-forest-soft:#B4C9B8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,p,ul,dl,dd,figure{margin:0}
ul{padding:0;list-style:none}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:20px 0}
.brand{font:800 22px/1 var(--display);letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--leaf)}
.nav{display:none;gap:2px;margin-left:auto}
.nav a,.pill{font:500 14px/1 var(--body);text-decoration:none;padding:10px 14px;border-radius:999px;color:var(--ink-soft)}
.nav a:hover{background:var(--mint);color:var(--ink)}
.pill{margin-left:auto;color:var(--ink);border:1.5px solid var(--ink)}
.pill:hover{background:var(--lime)}
@media(min-width:800px){.nav{display:flex}.pill{margin-left:8px}}

/* hero */
.zone{position:relative;isolation:isolate;background:radial-gradient(640px 420px at 88% 0%,rgba(198,243,107,.4),transparent 70%)}
.zone::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 1.4px);background-size:24px 24px;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 35%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 35%,transparent 100%)}
.hero{display:grid;gap:44px;padding:28px 0 76px}
.hero-text{display:grid;gap:22px;justify-items:start;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 4px rgba(14,122,78,.18)}
.name{font:800 clamp(52px,13vw,104px)/.9 var(--display);letter-spacing:-.04em;text-wrap:balance;max-width:100%}
.name span{color:var(--leaf);white-space:nowrap}
.roles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roles li{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--mono);padding:8px 12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--surface)}
.roles li.bare{border:0;padding:0;background:none}
.tagline{font:500 clamp(21px,2.6vw,28px)/1.3 var(--display);letter-spacing:-.01em;max-width:22em}
.hl{background:linear-gradient(transparent 60%,var(--lime) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--body);padding:15px 22px;border-radius:999px;text-decoration:none;border:1.5px solid var(--forest);transition:background .15s,color .15s,border-color .15s}
.btn.primary{background:var(--forest);color:var(--paper)}
.btn.primary:hover{background:var(--leaf);border-color:var(--leaf)}
.btn.ghost{color:var(--ink)}
.btn.ghost:hover{background:var(--lime)}

.visual{display:grid;justify-items:start;width:100%;max-width:440px}
.portrait{position:relative;width:min(78%,340px);aspect-ratio:4/5}
.frame,.frame-shadow{position:absolute;inset:0;border-radius:46% 10% 46% 10%/37% 8% 37% 8%}
.frame-shadow{border:1.5px solid var(--ink);transform:translate(12px,12px)}
.frame{overflow:hidden;display:grid;place-items:center;background:radial-gradient(120% 90% at 18% 8%,#33B57B 0%,var(--leaf) 52%,#0A5A3A 100%)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.monogram{font:800 clamp(84px,26vw,136px)/1 var(--display);letter-spacing:-.06em;color:var(--lime)}
.photo-tools{position:absolute;left:0;right:0;top:9%;z-index:3;display:grid;justify-items:center;gap:8px}
.code{position:relative;z-index:2;justify-self:end;width:min(94%,372px);margin-top:-58px;background:var(--forest);color:var(--on-forest);border-radius:16px;padding:14px 18px 18px;font:400 12.5px/1.75 var(--mono);box-shadow:0 28px 50px -28px rgba(15,42,29,.7);transform:rotate(-1.5deg)}
.code-tab{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--on-forest-soft);margin-bottom:8px}
.code-tab i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.ln{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:2ch;text-indent:-2ch}
.ln.in{padding-left:4ch}
.k{color:#7FD6A3}.v{color:#fff}.n{color:var(--on-forest)}.s{color:var(--lime)}.p{color:#8FA897}

@media(min-width:900px){
  .hero{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:64px;align-items:center;padding:48px 0 108px}
  .name{font-size:clamp(64px,7.6vw,104px)}
  .visual{justify-self:end}
}

/* sections */
.sec{display:grid;gap:22px;padding:56px 0;border-top:1px solid var(--line)}
.label{font:500 13px/1.4 var(--mono);color:var(--leaf);text-transform:lowercase;letter-spacing:.02em}
.sec-body{display:grid;gap:32px;min-width:0}
@media(min-width:900px){
  .sec{grid-template-columns:200px minmax(0,1fr);gap:56px;padding:88px 0}
  .label{position:sticky;top:28px;align-self:start}
}

.lead{font:500 clamp(21px,2.5vw,29px)/1.38 var(--display);letter-spacing:-.012em;max-width:27em;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 32px;padding-top:28px;border-top:1px solid var(--line)}
.facts dt{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.facts dd{font-weight:600}

.feature{position:relative;overflow:hidden;display:grid;gap:14px;background:var(--forest);color:var(--on-forest);border-radius:26px;padding:clamp(24px,4vw,44px)}
.feature h3{position:relative;font:700 clamp(30px,4.4vw,48px)/1 var(--display);letter-spacing:-.03em;color:var(--lime)}
.feature p{position:relative;max-width:54ch;color:var(--on-forest-soft)}
.feature .tools{position:relative}
.braces{position:absolute;right:.04em;bottom:-.28em;font:500 clamp(120px,22vw,230px)/1 var(--mono);letter-spacing:-.14em;color:rgba(198,243,107,.09);pointer-events:none;-webkit-user-select:none;user-select:none}
.rows{display:grid}
.row{display:grid;gap:6px;padding:22px 0;border-bottom:1px solid var(--line)}
.row h3{font:600 19px/1.3 var(--display);letter-spacing:-.01em}
.row p{color:var(--ink-soft);font-size:16px;max-width:60ch}
@media(min-width:720px){.row{grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:8px 32px}.row .tools{grid-column:1/-1}}

.jobs{display:grid}
.job{display:grid;gap:16px;padding:30px 0;border-bottom:1px solid var(--line)}
.job:first-child{padding-top:0}
.job h3{font:700 clamp(22px,2.6vw,28px)/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.place{font:500 13px/1.4 var(--mono);color:var(--leaf);margin-top:8px}
.points{display:grid;gap:10px}
.points li{position:relative;display:flex;gap:8px;align-items:flex-start;padding-left:28px;color:var(--ink-soft);max-width:62ch}
.points li::before{content:"";position:absolute;left:0;top:.78em;width:14px;height:2px;background:var(--leaf)}

.langs{display:grid;gap:28px 40px}
@media(min-width:640px){.langs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lang{display:grid;gap:12px;align-content:start;padding-top:18px;border-top:2px solid var(--ink)}
.lang h3{font:700 26px/1.1 var(--display);letter-spacing:-.02em}
.meter{display:flex;align-items:center;gap:7px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--leaf);background:transparent;padding:0}
.dot.on{background:var(--leaf)}
button.dot{width:24px;height:24px;cursor:pointer}
.lvl{font:500 13px/1 var(--mono);color:var(--ink-soft);margin-left:6px}
.note{color:var(--ink-soft);font-size:16px;max-width:44ch}

/* contact band */
.band{background:var(--forest);color:var(--on-forest)}
.band .sec{border-top:0}
.band .label{color:var(--lime)}
.band :focus-visible,.feature :focus-visible,.proj :focus-visible,.bar :focus-visible,.code :focus-visible{outline-color:var(--lime)}
.crows{display:grid}
.crow{display:grid;gap:10px;justify-items:start;padding:22px 0;border-bottom:1px solid rgba(234,245,230,.16)}
.crow:first-child{padding-top:0}
.clabel{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-forest-soft)}
.cval{font:600 clamp(20px,3.6vw,38px)/1.2 var(--display);letter-spacing:-.02em;color:#fff;text-decoration:none;overflow-wrap:anywhere}
a.cval:hover{color:var(--lime)}
.copy{font:500 13px/1 var(--body);color:var(--on-forest);background:transparent;border:1px solid rgba(234,245,230,.35);border-radius:999px;padding:9px 14px;cursor:pointer}
.copy:hover{background:var(--lime);color:var(--forest);border-color:var(--lime)}
@media(min-width:600px){.crow{grid-template-columns:minmax(0,1fr) auto;align-items:center}.clabel{grid-column:1/-1}}
.foot{padding:0 0 40px;font-size:14px;color:var(--on-forest-soft)}

/* editing (shown to the page owner only) */
.fab{position:fixed;right:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:8px;font:600 15px/1 var(--body);color:var(--forest);background:var(--lime);border:1.5px solid var(--forest);border-radius:999px;padding:14px 18px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(15,42,29,.6)}
.fab svg{width:16px;height:16px}
.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:720px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--forest);color:var(--on-forest);border:1px solid rgba(234,245,230,.22);border-radius:18px;padding:12px 12px 12px 18px;box-shadow:0 22px 44px -18px rgba(15,42,29,.75)}
.bar-msg{flex:1 1 200px;font-size:14px;line-height:1.4}
.bar-actions{display:flex;gap:8px;margin-left:auto}
.bar button{font:600 14px/1 var(--body);border-radius:999px;padding:12px 18px;cursor:pointer;border:1.5px solid rgba(234,245,230,.4);background:transparent;color:var(--on-forest)}
.bar .save{background:var(--lime);border-color:var(--lime);color:var(--forest)}
.bar button:disabled{opacity:.55;cursor:default}
.editing .band{padding-bottom:120px}

/* projects */
.projs{display:grid;gap:16px}
.proj{position:relative;overflow:hidden;isolation:isolate;display:grid;gap:30px;background:var(--forest);color:var(--on-forest);border-radius:26px;padding:clamp(24px,4vw,44px)}
.pulse{display:none;position:absolute;left:0;right:0;bottom:22px;z-index:-1;height:120px;color:var(--lime);opacity:.13;pointer-events:none}
.pulse svg{width:100%;height:100%;display:block}
.proj-main{display:grid;gap:16px;justify-items:start;align-content:start;min-width:0}
.proj-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.proj h3{font:800 clamp(44px,7vw,72px)/1 var(--display);letter-spacing:-.045em;color:#fff}
.native{font:600 clamp(24px,3.2vw,34px)/1.3 "Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;color:var(--lime)}
.prole{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--mono);color:var(--lime);border:1px solid rgba(198,243,107,.45);border-radius:999px;padding:8px 12px}
.ptext{font-size:17px;color:var(--on-forest-soft);max-width:50ch}
.btn.lime{margin-top:6px;background:var(--lime);border-color:var(--lime);color:var(--forest)}
.btn.lime:hover{background:#fff;border-color:#fff}
.purl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:500 14px/1.4 var(--mono)}
.purl-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-forest-soft)}
.proj-side{display:grid;gap:14px;align-content:start;min-width:0;padding-top:20px;border-top:1px solid rgba(234,245,230,.16)}
.proj-sub{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-forest-soft)}
.pfeats{display:grid;gap:12px}
.pfeats li{position:relative;display:flex;gap:8px;align-items:flex-start;padding-left:28px;color:var(--on-forest);line-height:1.5}
.pfeats li::before{content:"";position:absolute;left:0;top:.72em;width:14px;height:2px;background:var(--lime)}
.proj .mini{color:var(--lime);border-color:var(--lime)}
.proj .mini:hover{background:rgba(198,243,107,.12)}
@media(min-width:900px){
  .pulse{display:block}
  .proj{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px}
  .proj-side{padding:0 0 0 32px;border-top:0;border-left:1px solid rgba(234,245,230,.16)}
}
.ed{outline:1.5px dashed rgba(14,122,78,.55);outline-offset:4px;border-radius:5px;cursor:text;min-width:3ch;min-height:1em}
span.ed{display:inline-block}
.ed:hover{background:rgba(198,243,107,.28)}
.ed:focus{outline:2px solid var(--leaf);background:rgba(198,243,107,.28)}
.ed:empty::before{content:attr(data-ph);opacity:.5;font-weight:400}
.feature .ed,.band .ed,.proj .ed{outline-color:rgba(198,243,107,.6)}
.feature .ed:focus,.band .ed:focus,.proj .ed:focus{outline-color:var(--lime);background:rgba(198,243,107,.14)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.x{flex:none;width:30px;height:30px;display:inline-grid;place-items:center;font:500 16px/1 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:50%;cursor:pointer;padding:0}
.x:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.roles .x{width:22px;height:22px;font-size:13px;margin-right:-4px}
.mini{font:500 13px/1 var(--body);color:var(--leaf);background:transparent;border:1.5px dashed var(--leaf);border-radius:999px;padding:9px 14px;cursor:pointer}
.mini:hover{background:var(--mint)}
.mini.solid{background:var(--surface);border-style:solid;border-color:var(--ink);color:var(--ink);box-shadow:0 8px 18px -10px rgba(15,42,29,.6)}

/* one load sequence for the hero */
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.intro .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@media(prefers-reduced-motion:reduce){.intro .rise{animation:none}.btn{transition:none}}
</style>
</head>

<script id="cv-js">

  }

    var node = document.createElement(tag), key, value, i;
    if (props) {
      for (key in props) {
        if (!Object.prototype.hasOwnProperty.call(props, key)) continue;
        value = props[key];

        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), value);

  }
  function splitName(name) {
    var s = String(name || '').trim(), i = s.lastIndexOf(' ');
    return i < 0 ? ['', s] : [s.slice(0, i), s.slice(i + 1)];

    } else {
      var parts = splitName(data.name);
      nameEl = h('h1', { class: 'name rise' }, parts[0] ? parts[0] + ' ' : null, h('span', { text: parts[1] }));
    }
    nameEl.setAttribute('style', '--i:1');

    var roles = h('ul', { class: 'roles rise', style: '--i:2' },
      data.roles.map(function (r, i) {
        return h('li', null, ed('span', 'roles.' + i, null, 'Role'),
          editing && xBtn('Remove role', function () { removeFrom(data.roles, i); }));
      }),
      editing && h('li', { class: 'bare' }, addBtn('Add role', function () {
        data.roles.push(''); render(); focusPath('roles.' + (data.roles.length - 1));
      })));

    var frame = h('div', { class: 'frame' }, data.photo
      ? h('img', { src: data.photo, alt: 'Portrait of ' + data.name })
      : h('span', { class: 'monogram', 'aria-hidden': 'true', text: initials(data.name) }));
    var photoTools = editing && h('div', { class: 'photo-tools' },
      h('label', { class: 'mini solid', 'for': 'photo-input' }, data.photo ? 'Change photo' : 'Add photo'),
      h('input', { type: 'file', id: 'photo-input', accept: 'image/*', class: 'sr', onchange: onPhoto }),
      data.photo && h('button', { type: 'button', class: 'mini solid', onclick: function () {
        data.photo = ''; render(); say('Photo removed. Save to keep the change.');
      } }, 'Remove photo'));

    return h('div', { class: 'zone' },
      topBar(has),
      h('section', { class: 'hero wrap', id: 'top' },
        h('div', { class: 'hero-text' },
          (editing || data.location) && h('p', { class: 'eyebrow rise', style: '--i:0' }, h('span', { 'data-bind': 'location', text: data.location })),
          nameEl,
          (editing || data.roles.length) ? roles : null,
          (editing || data.tagline) && h('p', { class: 'tagline rise', style: '--i:3' }, ed('span', 'tagline', 'hl', 'A one-line introduction')),
          h('div', { class: 'cta rise', style: '--i:4' },
            h('a', { class: 'btn primary', href: mailHref(), target: '_blank', rel: 'noopener' }, 'Get in touch', h('span', { 'aria-hidden': 'true', text: '→' })),
            has.experience && h('a', { class: 'btn ghost', href: '#experience', 'data-go': 'experience' }, 'View experience'))),
        h('div', { class: 'visual' },
          h('figure', { class: 'portrait rise', style: '--i:3' }, h('div', { class: 'frame-shadow', 'aria-hidden': 'true' }), frame, photoTools),
          codeCard())));
  }

  function fact(label, path, placeholder) {
    if (!editing && !get(path)) return null;
    return h('div', null, h('dt', { text: label }), ed('dd', path, null, placeholder));
  }
  function linkHref(url) {
    var u = String(url || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return /^https?:\/\/[^\s"<>]+$/i.test(u) ? u : '';
  }
  function linkLabel(url) {
    return String(url || '').trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '');
  }
  function pulse() {
    var box = h('span', { class: 'pulse', 'aria-hidden': 'true' });
    box.innerHTML = '<svg viewBox="0 0 600 120" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M0 70H210l14-22 14 22h28l14-62 18 104 16-60 10 18H600"/></svg>';
    return box;
  }
  function projects() {
    return section('projects', 'Projects', [
      h('div', { class: 'projs' }, data.projects.map(function (pr, i) {
        var p = 'projects.' + i;
        var href = linkHref(pr.url);
        var native = (editing || pr.native) ? ed('span', p + '.native', 'native', 'Name in Arabic (optional)') : null;
        if (native) native.setAttribute('dir', 'auto');
        if (!pr.features) pr.features = [];
        return h('article', { class: 'proj' },
          pulse(),
          h('div', { class: 'proj-main' },
            h('div', { class: 'proj-head' }, ed('h3', p + '.name', null, 'Project name'), native),
            (editing || pr.role) && h('p', { class: 'prole' }, 'Role: ', ed('span', p + '.role', null, 'Your role')),
            (editing || pr.text) && ed('p', p + '.text', 'ptext', 'What the project is'),
            editing
              ? h('p', { class: 'purl' }, h('span', { class: 'purl-label', text: 'Link' }), ed('span', p + '.url', null, 'https://example.com'))
              : (href && h('a', { class: 'btn lime', href: href, target: '_blank', rel: 'noopener' }, 'Visit ' + linkLabel(pr.url), h('span', { 'aria-hidden': 'true', text: '↗' })))),
          (editing || pr.features.length) ? h('div', { class: 'proj-side' },
            h('p', { class: 'proj-sub', text: 'What it does' }),
            h('ul', { class: 'pfeats' }, pr.features.map(function (f, j) {
              return h('li', null, ed('span', p + '.features.' + j, null, 'A feature'),
                editing && xBtn('Remove feature', function () { removeFrom(pr.features, j); }));
            })),
            editing && h('div', { class: 'tools' },
              addBtn('Add feature', function () { pr.features.push(''); render(); focusPath(p + '.features.' + (pr.features.length - 1)); }),
              upBtn(data.projects, i, 'project'),
              xBtn('Remove project', function () { removeFrom(data.projects, i); }))) : null);
      })),
      editing && h('div', { class: 'tools' }, addBtn('Add project', function () {
        data.projects.push({ name: '', native: '', role: '', url: '', text: '', features: [''] });
        render(); focusPath('projects.' + (data.projects.length - 1) + '.name');
      }))
    ]);
  }

  function about() {
    return section('about', 'About', [
      (editing || data.summary) && ed('p', 'summary', 'lead', 'A short summary about you'),
      h('dl', { class: 'facts' },
        fact('Based in', 'location', 'City, country'),
        fact('Born', 'born', 'Date of birth'),
        fact('Open to', 'availability', 'For example: evening shifts'))
    ]);
  }

  function skills() {
    var feature = null, rows = [];
    data.skills.forEach(function (s, i) {
      var p = 'skills.' + i;
      var tools = editing && h('div', { class: 'tools' }, upBtn(data.skills, i, 'skill'),
        xBtn('Remove skill', function () { removeFrom(data.skills, i); }));
      var title = ed('h3', p + '.title', null, 'Skill name');
      var text = (editing || s.text) && ed('p', p + '.text', null, 'Describe this skill');
      if (i === 0) feature = h('article', { class: 'feature' }, h('span', { class: 'braces', 'aria-hidden': 'true', text: '{ }' }), title, text, tools);
      else rows.push(h('article', { class: 'row' }, title, text, tools));
    });
    return section('skills', 'Skills', [
      feature,
      rows.length ? h('div', { class: 'rows' }, rows) : null,
      editing && h('div', { class: 'tools' }, addBtn('Add skill', function () {
        data.skills.push({ title: '', text: '' }); render(); focusPath('skills.' + (data.skills.length - 1) + '.title');
      }))
    ]);
  }

  function experience() {
    return section('experience', 'Experience', [
      h('div', { class: 'jobs' }, data.experience.map(function (job, i) {
        var p = 'experience.' + i;
        return h('article', { class: 'job' },
          h('header', null,
            ed('h3', p + '.title', null, 'Job title'),
            (editing || job.place) && ed('p', p + '.place', 'place', 'Company or place')),
          h('ul', { class: 'points' }, job.points.map(function (pt, j) {
            return h('li', null, ed('span', p + '.points.' + j, null, 'What you did'),
              editing && xBtn('Remove point', function () { removeFrom(job.points, j); }));
          })),
          editing && h('div', { class: 'tools' },
            addBtn('Add point', function () { job.points.push(''); render(); focusPath(p + '.points.' + (job.points.length - 1)); }),
            upBtn(data.experience, i, 'job'),
            xBtn('Remove job', function () { removeFrom(data.experience, i); })));
      })),
      editing && h('div', { class: 'tools' }, addBtn('Add experience', function () {
        data.experience.push({ title: '', place: '', points: [''] }); render(); focusPath('experience.' + (data.experience.length - 1) + '.title');
      }))
    ]);
  }

  function meter(lang) {
    var level = Number(lang.level) || 0, k;
    var m = h('div', { class: 'meter', role: editing ? 'group' : 'img', 'aria-label': 'Level ' + level + ' out of 5' });
    for (k = 1; k <= 5; k++) (function (k) {
      m.appendChild(editing
        ? h('button', { type: 'button', class: k <= level ? 'dot on' : 'dot', 'aria-label': 'Set level ' + k + ' of 5', onclick: function () { lang.level = k; render(); } })
        : h('span', { class: k <= level ? 'dot on' : 'dot' }));
    })(k);
    m.appendChild(h('span', { class: 'lvl', 'aria-hidden': 'true', text: level + '/5' }));
    return m;
  }
  function languages() {
    return section('languages', 'Languages', [
      h('div', { class: 'langs' }, data.languages.map(function (lang, i) {
        var p = 'languages.' + i;
        return h('article', { class: 'lang' },
          ed('h3', p + '.name', null, 'Language'),
          meter(lang),
          (editing || lang.note) && ed('p', p + '.note', 'note', 'Optional note'),
          editing && h('div', { class: 'tools' }, upBtn(data.languages, i, 'language'),
            xBtn('Remove language', function () { removeFrom(data.languages, i); })));
      })),
      editing && h('div', { class: 'tools' }, addBtn('Add language', function () {
        data.languages.push({ name: '', level: 3, note: '' }); render(); focusPath('languages.' + (data.languages.length - 1) + '.name');
      }))
    ]);
  }

  function contactRow(label, path, href, placeholder) {
    var value = get(path);
    if (!editing && !value) return null;
    return h('div', { class: 'crow' },
      h('span', { class: 'clabel', text: label }),
      editing ? ed('span', path, 'cval', placeholder) : h('a', { class: 'cval', href: path === 'email' ? mailHref() : href, target: '_blank', rel: 'noopener', text: value }),
      !editing && h('button', { type: 'button', class: 'copy', 'aria-label': 'Copy ' + label.toLowerCase(), onclick: function (e) { copy(value, e.currentTarget); } }, 'Copy'));
  }
  function contact() {
    return h('div', { class: 'band' },
      section('contact', 'Contact', h('div', { class: 'crows' },
        contactRow('Email', 'email', 'mailto:' + data.email, 'name@example.com'),
        contactRow('Phone', 'phone', telHref(data.phone), 'Phone number'),
        data.location ? h('div', { class: 'crow' }, h('span', { class: 'clabel', text: 'Location' }), h('span', { class: 'cval', 'data-bind': 'location', text: data.location })) : null)),
      h('footer', { class: 'foot wrap' }, h('span', { 'data-bind': 'name', text: data.name })));
  }
  function copy(text, btn) {
    function done(ok) {
      btn.textContent = ok ? 'Copied' : 'Could not copy';
      setTimeout(function () { btn.textContent = 'Copy'; }, 1800);
    }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); }
    catch (e) { done(false); }
  }

  /* ---------- drawing ---------- */
  function render() {
    var y = window.pageYOffset;
    var has = {
      about: true,
      projects: editing || data.projects.length > 0,
      skills: editing || data.skills.length > 0,
      experience: editing || data.experience.length > 0,
      languages: editing || data.languages.length > 0
    };
    app.textContent = '';
    append(app, [
      hero(has),
      h('main', null, about(), has.projects && projects(), has.skills && skills(), has.experience && experience(), has.languages && languages()),
      contact()
    ]);
    document.body.classList.toggle('editing', editing);
    window.scrollTo(0, y);
  }
  /* Keep the pieces that repeat a field (code card, initials, location) in step while typing. */
  function syncDerived() {
    Array.prototype.forEach.call(app.querySelectorAll('[data-bind]'), function (n) {
      var v = get(n.getAttribute('data-bind'));
      n.textContent = v == null ? '' : String(v);
    });
    var card = document.getElementById('code-card');
    if (card) fillCode(card);
    var mono = app.querySelector('.monogram');
    if (mono) mono.textContent = initials(data.name);
    var mark = app.querySelector('.brand-mark');
    if (mark) mark.textContent = initials(data.name);
  }

  app.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('[data-go]') : null;
    if (!link) return;
    var target = document.getElementById(link.getAttribute('data-go'));
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  });
  app.addEventListener('input', function (e) {
    var node = e.target.closest ? e.target.closest('[data-path]') : null;
    if (!node) return;
    var text = node.textContent.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ');
    if (!text.trim()) { text = ''; if (node.firstChild) node.textContent = ''; }
    set(node.getAttribute('data-path'), text);
    syncDerived();
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var node = e.target.closest ? e.target.closest('[data-path]') : null;
    if (node) { e.preventDefault(); node.blur(); }
  });
  app.addEventListener('paste', function (e) {
    var node = e.target.closest ? e.target.closest('[data-path]') : null;
    if (!node || !e.clipboardData) return;
    e.preventDefault();
    var text = e.clipboardData.getData('text/plain').replace(/\s+/g, ' ');
    try { document.execCommand('insertText', false, text); } catch (err) { /* typing still works */ }
  });

  /* ---------- photo ---------- */
  function onPhoto(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var W = 720, H = 900, canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      var w = img.naturalWidth * k, hh = img.naturalHeight * k;
      canvas.getContext('2d').drawImage(img, (W - w) / 2, (H - hh) * 0.35, w, hh);
      URL.revokeObjectURL(url);
      try { data.photo = canvas.toDataURL('image/jpeg', 0.84); }
      catch (err) { say('This photo could not be prepared. Try a JPG or PNG file.'); return; }
      render();
      say('Photo added. Save to keep it.');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      say('This file could not be read as an image. Try a JPG or PNG file.');
    };
    img.src = url;
  }

  /* ---------- editing and saving (page owner only) ---------- */
  var HINT = 'Tap any text to change it, then save.';
  var msg = h('p', { class: 'bar-msg', id: 'bar-msg', role: 'status', text: HINT });
  var cancelBtn = h('button', { type: 'button', id: 'edit-cancel', onclick: cancelEdit }, 'Cancel');
  var saveBtn = h('button', { type: 'button', id: 'edit-save', class: 'save', onclick: saveEdit }, 'Save');
  var bar = h('div', { class: 'bar', role: 'region', 'aria-label': 'Editing controls', hidden: true },
    msg, h('div', { class: 'bar-actions' }, cancelBtn, saveBtn));
  var fab = h('button', { type: 'button', class: 'fab', id: 'edit-start', hidden: true, onclick: startEdit });
  fab.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.2 2.3l2.5 2.5L5.4 13.1 2.2 13.8l.7-3.2z"/></svg>';
  fab.appendChild(document.createTextNode('Edit page'));
  document.body.appendChild(fab);
  document.body.appendChild(bar);

  function say(text) { msg.textContent = text; }
  function startEdit() {
    editing = true; fab.hidden = true; bar.hidden = false; say(HINT); render();
  }
  function stopEdit() {
    editing = false; bar.hidden = true; fab.hidden = !api; render();
  }
  function cancelEdit() { data = clone(saved); stopEdit(); }

  function tidy(d) {
    function s(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
    return {
      name: s(d.name) || saved.name,
      roles: d.roles.map(s).filter(Boolean),
      tagline: s(d.tagline),
      summary: s(d.summary),
      email: s(d.email),
      phone: s(d.phone),
      location: s(d.location),
      born: s(d.born),
      availability: s(d.availability),
      photo: typeof d.photo === 'string' && d.photo.indexOf('data:image/') === 0 ? d.photo : '',
      projects: (d.projects || []).map(function (x) {
        return { name: s(x.name), native: s(x.native), role: s(x.role), url: s(x.url), text: s(x.text), features: (x.features || []).map(s).filter(Boolean) };
      }).filter(function (x) { return x.name || x.text || x.url; }),
      skills: d.skills.map(function (x) { return { title: s(x.title), text: s(x.text) }; })
        .filter(function (x) { return x.title || x.text; }),
      experience: d.experience.map(function (x) { return { title: s(x.title), place: s(x.place), points: x.points.map(s).filter(Boolean) }; })
        .filter(function (x) { return x.title || x.place || x.points.length; }),
      languages: d.languages.map(function (x) { return { name: s(x.name), level: Math.min(5, Math.max(1, Math.round(Number(x.level) || 1))), note: s(x.note) }; })
        .filter(function (x) { return x.name; })
    };
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function buildDocument(content) {
    var json = JSON.stringify(content).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' + HEAD + '\n<title>' + esc(document.title || content.name) + '<\/title>\n' +
      '<style id="cv-css">' + SRC_CSS + '<\/style>\n<\/head>\n<body>\n<div id="app"><\/div>\n' +
      '<script type="application/json" id="cv-data">' + json + '<\/script>\n' +
      '<script id="cv-js">' + SRC_JS + '<\/script>\n<\/body>\n<\/html>\n';
  }
  function saveEdit() {
    if (!api) return;
    var content = tidy(data);
    saveBtn.disabled = true; cancelBtn.disabled = true; say('Saving…');
    api.publish(buildDocument(content)).then(function () {
      saved = content; data = clone(content);
      saveBtn.disabled = false; cancelBtn.disabled = false;
      stopEdit();
    }, function (err) {
      var code = err && err.code;
      saveBtn.disabled = false; cancelBtn.disabled = false;
      if (code === 'conflict') say('A newer version of this page was saved elsewhere. The page is reloading to it.');
      else if (code === 'too_large') say('The page is too large to save. Try a smaller photo.');
      else if (code === 'rate_limited') say('Too many saves in a short time. Wait a moment, then save again.');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' || code === 'capability_disabled' || code === 'capability_removed') {
        api = null; saveBtn.disabled = true;
        say('This view is read-only, so changes cannot be saved here.');
      }
      else say('Saving did not work. Check your connection, then save again.');
    });
  }
  /* The Edit button appears only for someone who is allowed to publish this page. */
  function initEditing(triesLeft) {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') {
      if (triesLeft > 0) setTimeout(function () { initEditing(triesLeft - 1); }, 700);
      return;
    }
    Promise.all([c.use('artifact'), c.use('user')]).then(function (r) {
      var artifact = r[0], user = r[1];
      if (!artifact || typeof artifact.publish !== 'function' || !user) return;
      return Promise.resolve(user.canEdit()).then(function (ok) {
        if (!ok) return;
        api = artifact;
        if (!editing) fab.hidden = false;
      });
    }).catch(function () { /* stay read-only */ });
  }

  /* ---------- start ---------- */
  app.className = 'intro';
  render();
  setTimeout(function () { app.className = ''; }, 1600);
  initEditing(4);
})();
</script>
</body>
</html>
